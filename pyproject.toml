[project]
name = "airtriage-hy26-app"
version = "0.1.0"
description = "Projekt obsługi modalności dronów dla ratowników górskich i medycznych w triażu."
readme = "README.md"
authors = [
    { name = "piotr", email = "piotrek.matusiewicz@gmail.com" }
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=6.30.0",
    "ipython>=9.0.0",
    "numpy>=2.0.0",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.172",
]

# nbutils is imported from the repository root (it is not an installed package),
# so there is nothing for uv_build to build.
[tool.uv]
package = false

# Heavy, only needed by nbutils/2_heart_rate_estimation.ipynb:
#   uv sync --extra hr
[project.optional-dependencies]
hr = ["vitallens>=0.6.1"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"