[project]
name = "airtriage-hy26-app"
version = "0.1.0"
description = "Projekt obsługi modalności dronów dla ratowników górskich i medycznych w triażu."
readme = "README.md"
authors = [
    { name = "piotr", email = "piotrek.matusiewicz@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "opencv-python<5",
    "standard-imghdr>=3.13.0",
    "ultralytics>=8.4.172",
    "vitallens>=0.6.1",
]

[project.scripts]
airtriage-hy26-app = "airtriage_hy26_app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
